name: EIHMR
device: cuda
components:
- type: segmentation
  name: human_segmentation
  backend: sam
- type: slam
  name: camera_estimation
  backend: droid
  use_masks: true
  align_to_world: true
  return_keyframe_info: true
- type: hpe
  name: gvhmr_preprocessing
  backend: prompthmr
  static_cam: false
  f_mm: null
  phmr_ckpt: data/pretrain/phmr/checkpoint.ckpt
  phmr_vid_cfg: data/pretrain/phmr_vid/prhmr_release_002.yaml
  phmr_vid_ckpt: data/pretrain/phmr_vid/prhmr_release_002.ckpt
  mask_prompt: false
  kpt_prompt: false
  official_video_head: true
  use_gt_video_k: true
  smooth_bbx: false
  img_size: 896
  use_mean_shape: false
  substep_cache_use: false
  substep_cache_overwrite: true
- type: depth_scene_refine
  name: oar_refine
  metric3d_model: metric3d_vit_small
  window_size: 61
  stride: 10
  sigma: 15.0
  opt_steps: 2
  opt_lr: 0.01
  loss_reproj_w: 1000
  loss_depth_w: 1.0
  loss_smooth_vel_w: 0.25
  loss_smooth_acc_w: 0.25
  loss_reg_w: 0.1
  enable_transl_2d_refine: true
  transl_2d_opt_steps: 60
  transl_2d_opt_lr: 0.02
  transl_2d_reproj_sigma: 50.0
  loss_transl_2d_w: 1.0
  loss_transl_2d_reg_w: 0.05
  loss_transl_2d_smooth_w: 0.1
  transl_2d_optimize_z: true
  enable_depth_constraint: false
  enable_depth_contact_ik: true
  enable_ik: false
  contact_ik_scene_model: josh_planes
  contact_ik_point_type: vertices
  contact_ik_blend: 0.25
  contact_ik_steps: 10
  contact_ik_lr: 0.002
  loss_contact_w: 2.0
  loss_contact_bp_reg_w: 0.2
  loss_contact_smooth_w: 1.0
  contact_ik_conf_thr: 0.55
  contact_ik_ground_loss: penetration
  contact_ik_ground_joint_ids:
  - 10
  - 11
  contact_ik_ground_joint_offsets:
    10: 0.0
    11: 0.0
  contact_ik_ground_offset_mode: fixed
  contact_ik_opt_joints:
  - 1
  - 2
  - 4
  - 5
  - 7
  - 8
  - 10
  - 11
  contact_ik_ground_use_human_mask: true
  contact_ik_vertex_ids:
  - 3216
  - 3387
  - 6617
  - 6787
  contact_ik_vertex_conf_indices:
  - 1
  - 0
  - 3
  - 2
  contact_ik_vertex_names:
  - LToe
  - LHeel
  - RToe
  - RHeel
  contact_ik_vertex_offsets:
  - 0.0
  - 0.0
  - 0.0
  - 0.0
  contact_ik_weighted_conf: false
  contact_ik_optimize_transl: false
  local_plane_radius: 45
  local_plane_sample_stride: 3
  local_plane_min_points: 40
  local_plane_inlier_thresh: 0.04
  local_plane_ransac_iters: 64
  local_plane_min_inlier_ratio: 0.35
  local_plane_max_residual: 0.025
  josh_anchor_w: 0.5
  josh_anchor_sigma: 0.08
  window_skating_mode: pp_static_joint
  enable_orient_refine: false
  enable_img_pose_refine: false
  img_pose_opt_steps: 30
  img_pose_opt_lr: 0.005
  loss_img3d_w: 5.0
  loss_img3d_sigma: 0.1
  loss_bodypose_reg_w: 0.1
  save_depth_maps: false
  fps: 30
  device: cuda
  render_offsets:
  - 0
  vis_oar_diagnostics: false
  vis_oar_frame_stride: 5
  save_window_mesh_observations: true
  window_mesh_point_type: joints22
  window_mesh_offsets: null
  vis_contact_ik_compare: false
- type: adjacent_smpl_renderer
  name: window_adjacent_rendering
  device: cuda
  render_mode: prompthmr_camera
  frame_selection_mode: uniform
  pre_dis: 5
  num_adjacent_frames: 6
  transl_source: oar_window
  mesh_color_mode: colorful
  uniform_mesh_color:
  - 0.75
  - 0.75
  - 0.75
  mesh_render_style: solid
  mesh_alpha: 0.5
  smpl_trans_scale: 1.0
  contour_thickness: 3
- type: camera_refine
  name: camera_refine
  frontend:
    use_rendered_for_keyframes: true
    keyframe_render_mode: adaptive
    texture_threshold: 40
    render_fusion_mode: replace
    render_alpha: 1.0
    max_translation_delta: 0.02
    max_rotation_delta_deg: 0.5
    fix_first_keyframe: true
    optimize_rotation: true
    min_common_keyframes: 4
    interpolate_delta_to_all_frames: true
    delta_coordinate_mode: baseline_world
  routing:
    keyframe_stride: 5
    local_metric_scale:
      enabled: false
      median_window: 15
      max_ratio_deviation: 0.2
      strength: 0.75
  human:
    max_debug_windows: 0
    debug_window_centers: null
    min_shared_frames: 3
    max_points_per_frame: 22
    mesh_loss_weight: 1.0
    pose_prior_weight: 0.5
    smooth_weight: 0.01
    relative_pose_weight: 0.1
    huber_delta: 0.05
    num_iters: 500
    lr: 0.005
    optimize_rotation: true
    fix_first_window: true
    max_translation_delta: 0.15
    max_rotation_delta_deg: 3.0
    interpolate_delta_to_all_frames: true
    accept_only_if_reduces_loss: true
- type: evaluation
  name: evaluation
  metrics:
  - pa_mpjpe
  - mpjpe
  - pve
  - accel
  - w_mpjpe
  - wa_mpjpe
  - rte
  - erve
  - jitter
  - fs
  - foot_floating_rate
  - ground_penetration
  - ate
  - ate_s
  chunk_length: 100
  fps: 30
